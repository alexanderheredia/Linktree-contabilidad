<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colegio Amapola - Planes de pago</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto';

        }

        body{
            background-image: url('./assets/fondo.png');
            background-size: cover;
            background-repeat: no-repeat;
            padding: 45px 24px;
        }

        .container{
            max-width: 520px;
            margin: 0 auto;
            margin-top: 50px;
            display: flex;
            flex-direction: column;
            padding: 0px 15px;
            border-radius: 20px;
            background-color: #fff;
            text-align: center;
            gap: 10px;
        }

        .logo{
            margin-top: 15px;
        }

        .links{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .links button{
            padding: 10px 20px;
        }

        button{
            padding: 5px 40px;
            font-size: 20px;
            border-radius: 10px;
            border: none;
            background-color: slateblue;
            color: #fff;
            cursor: pointer;
            transition: ease all 0.3s;
        }

        button:hover{
            background-color: steelblue;
        }

        button:active{
            background-color: rgb(124, 187, 238);
        }
        
        p{
            margin-bottom: 25px;
        }

        #whatsapp{
            padding: 10px 90px;
        }

        #cuentas{
            padding: 10px 53px;
        }

        #planes{
            padding: 10px 75px;
        }

        #pre{
            padding: 10px 70px;
        }
        
        #uniform{
            padding: 10px 85px;
        }

        /* responsive */

        @media (min-width: 510px){
            #whatsapp{
                padding: 10px 150px;
            }

            #cuentas{
                padding: 10px 115px;
            }

            #planes{
                padding: 10px 137px;
            }

            #pre{
                padding: 10px 130px;
            }
            
            #uniform{
                padding: 10px 147px;
            }
        }

        @media (min-width: 520px){

        }


    </style>

</head>
<body>
    
    <div class="container">

        <div class="logo">
            <img src="./assets/logo.png" alt="" width="100px">
        </div>

        <h3>Colegio Amapola</h3>
        <p>Somos una institución académica con más de 30 años de experiencia. Somos "Agentes de Cambio."</p>


        <div class="links">
            <a href="https://wa.me/18494087985?text=Buenos%20d%C3%ADas.%20Me%20gustar%C3%ADa%20recibir%20informaci%C3%B3n%20sobre%20inscripciones%20y%20disponibilidad%20de%20cupos.%20" target="_blank">
                <button id="whatsapp">Whatsapp</button>
            </a>
            
            <a href="./assets/post feed.pdf" target="_blank">
                <button id="cuentas">Cuentas de banco</button>
            </a>
            
            <a href="./assets/COLEGIO AMAPOLA plan de pagos.pdf" target="_blank">
                <button id="planes">Plan de pago</button>
            </a>
            
            <a href="https://site3.q10.com/Preinscripcion?aplentId=c9394a93-a8a0-4585-b800-d7b2a01b29dd" target="_blank">
                <button id="pre">Preinscripcion</button>
            </a>
            
            <a href="./assets/polos.pdf" target="_blank">
                <button id="uniform">Uniformes</button>
            </a>
        </div>

        <div class="correo">
            <h1>Gmail:</h1>
            <p>pagos.colegioamapola@gmail.com</p>
        </div>

    </div>

</body>
</html>
